services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mirage_test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
    command: >
      postgres
        -c log_statement=all
        -c log_min_duration_statement=0
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d mirage_test"]
      interval: 2s
      timeout: 3s
      retries: 10

  test-runner:
    build:
      context: ..
      dockerfile: Dockerfile.test
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MIRAGE_TEST_DATABASE_URL: "postgres://test:test@postgres:5432/mirage_test?sslmode=disable"
    command: >
      sh -c "go test -tags=integration -race -p 1 -count=1 ./..."
